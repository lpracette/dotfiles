# --- Color Variables ---
%hidden HI_COLOR="#7aa2f7"   # blue
%hidden HI_ALT="#bb9af7"     # magenta for 'OFF' state
%hidden BG_DEFAULT="default"
%hidden FG_DEFAULT="white"
%hidden WARN_COLOR="red"
%hidden WG_IS_KEYS_OFF="#[fg=${FG_DEFAULT},bg=${WARN_COLOR}]#([ $(tmux show-option -qv key-table) = 'off' ] && echo ' OFF ')#[default]"

# --- General Settings & Performance ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on                  #
set -g history-limit 10000              #
set -sg escape-time 1                   # Fix Vim ESC delay
set -g status-position top
set -g mouse on
set -g base-index 1                     #
setw -g pane-base-index 1               #
set -g renumber-windows on              #
set -g allow-passthrough on             #
setw -g mode-keys vi                    #

# Match Vim's word separators for better navigation
set -g word-separators "<>(){}[]/'\";@*+,.-_=!£$%^&:#~?`¬|\\ "

# --- Keybindings ---
set -g prefix C-Space                   #
unbind C-b
bind C-Space last-window                #

bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"     

bind x kill-pane                        #
bind X kill-window                      #
bind Q confirm-before -p "kill-session #S? (y/n)" kill-session
bind C-s if -F '#{s/off//:status}' 'set status off' 'set status on'

# Copy Mode Logic (macOS support)
if-shell 'which -s pbcopy' 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy'

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-vim 'session'
set -g @continuum-save-interval '15'

# --- Custom Status Line ---
set -g status-style "bg=${BG_DEFAULT},fg=${FG_DEFAULT}"
set -g window-status-format " #[fg=${FG_DEFAULT}]#I #W "
set -g window-status-last-style "fg=${HI_COLOR},bold"
set -g window-status-current-format "#[fg=black,bg=${HI_COLOR}] #I #W "
set -g status-right-length 40
set -g status-right "${WG_IS_KEYS_OFF}#[fg=${FG_DEFAULT}]%b %d %H:%M "
set -g status-left "#[fg=${HI_COLOR},bold][#S] "
set -g status-interval 15

# --- Hooks & Conditionals ---

# Prompt for window name on creation
set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'
setw -g automatic-rename off 

# Move status bar to bottom if in SSH
if-shell 'test -n "$SSH_CLIENT"' 'set -g status-position bottom'

# --- F12 Nesting & Splits ---
# Changes active window color to purple (HI_ALT) when keys are off
bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    setw -g window-status-current-format "#[fg=black,bg=${HI_ALT}] #I #W " \; \
    refresh-client -S

bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    setw -g window-status-current-format "#[fg=black,bg=${HI_COLOR}] #I #W " \; \
    refresh-client -S

# --- Initialize TPM ---
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run -b '~/.tmux/plugins/tpm/tpm'
